name: Build Windows and Android Clients

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64 installer
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Verify frontend
        working-directory: apps/desktop
        run: |
          npm run build
          npm test

      - name: Fetch pinned runtimes required by the desktop build
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/Fetch-EasyTierRuntime.ps1 -Architecture x64
          ./scripts/Fetch-Iperf3Runtime.ps1 -Architecture x64

      - name: Format and test Rust service
        run: |
          cargo fmt --all -- --check
          cargo test -p vibe-easytier-service --locked

      - name: Build release service host
        run: cargo build --release -p vibe-easytier-service

      - name: Stage release service
        shell: pwsh
        run: ./scripts/Stage-VibeEasyTierService.ps1 -Architecture x64

      - name: Test desktop and validate packaging
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo test -p vibe-easytier-desktop --locked
          ./scripts/Test-EasyTierPackaging.ps1 -Architecture x64 -RequireRuntime -RequireServiceBinary -VerifyReleaseMetadata

      - name: Build NSIS installer
        working-directory: src-tauri
        run: npm --prefix ../apps/desktop exec -- tauri build --bundles nsis

      - name: Assert NSIS installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path .\target\release\bundle\nsis -Filter '*.exe' -File -Recurse | Select-Object -First 1
          if ($null -eq $installer) {
            throw 'Tauri did not emit an NSIS installer artifact.'
          }
          Write-Output "Built NSIS installer: $($installer.FullName)"

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: vibe-easytier-windows-x64
          path: target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

      - name: Smoke test fresh install, upgrade, and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem -Path .\target\release\bundle\nsis -Filter '*.exe' -File -Recurse | Select-Object -First 1
          .\scripts\Invoke-EasyTierInstallerSmoke.ps1 -InstallerPath $installer.FullName

  android:
    name: Android 14 arm64 APK
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 34 and NDK r26
        shell: pwsh
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.3.11579264"

      - name: Install Rust and Android target
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: aarch64-linux-android

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "29.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build pinned EasyTier Android runtime
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cargo install cargo-ndk --locked
          git clone --filter=blob:none https://github.com/EasyTier/EasyTier.git "$env:RUNNER_TEMP\EasyTier"
          git -C "$env:RUNNER_TEMP\EasyTier" checkout 8428a89d2dabc94c97d370ec607c6ca142473626

          $protoc = (Get-Command protoc -ErrorAction Stop).Source
          $timestamp = Get-ChildItem $env:RUNNER_TOOL_CACHE -Filter timestamp.proto -File -Recurse |
            Where-Object { $_.FullName -match '[\\/]include[\\/]google[\\/]protobuf[\\/]timestamp\.proto$' } |
            Select-Object -First 1
          if ($null -eq $timestamp) {
            throw 'setup-protoc did not provide the standard protobuf include directory.'
          }
          $protocInclude = $timestamp.Directory.Parent.Parent.FullName
          $libclang = Get-ChildItem 'C:\Program Files\LLVM' -Filter libclang.dll -File -Recurse |
            Select-Object -First 1
          if ($null -eq $libclang) {
            throw 'The GitHub runner does not contain libclang.dll.'
          }

          ./a14/scripts/Build-EasyTierNative.ps1 `
            -EasyTierSource "$env:RUNNER_TEMP\EasyTier" `
            -AndroidNdk "$env:ANDROID_SDK_ROOT\ndk\26.3.11579264" `
            -ProtocPath $protoc `
            -ProtocInclude $protocInclude `
            -LibClangPath $libclang.Directory.FullName `
            -SkipRustTargetInstall

      - name: Test, lint, and assemble Android client
        shell: pwsh
        run: ./a14/gradlew.bat -p ./a14 testDebugUnitTest lintDebug assembleDebug

      - name: Assert Android runtime is packaged
        shell: pwsh
        run: |
          $apk = Get-ChildItem ./a14/app/build/outputs/apk/debug -Filter '*.apk' -File | Select-Object -First 1
          if ($null -eq $apk) {
            throw 'Gradle did not emit an Android APK.'
          }
          $entries = & jar tf $apk.FullName
          foreach ($library in @('lib/arm64-v8a/libeasytier_ffi.so', 'lib/arm64-v8a/libeasytier_android_jni.so')) {
            if ($entries -notcontains $library) {
              throw "APK is missing $library."
            }
          }

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: vibe-easytier-android14-arm64
          path: a14/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
